<title id="ar-title">How a new benchmark replaces the current one</title>
<desc id="ar-desc">A new run is saved apart from the published results and validated. The current benchmark is then copied whole into the archive, and that copy is validated against what was published. Only then does the new run become the current benchmark, and the change is committed and tagged. In motion, it lights in order. The new run is checked while it is still apart: New run on a newer Claude Code, then Validate the new run. The current benchmark is kept before anything is replaced: Archive the current benchmark, then Validate the archive. Only then does the new run take its place: Promote the new run, then Commit and tag.</desc>
