<title id="ex-title">How one comparison runs</title>
<desc id="ex-desc">The task&#x27;s starting files are rebuilt and the task prompt is given to a new session with Code Mode off; the run is scored and measured. The files are rebuilt again and the same prompt goes to a new session with Code Mode on, which is scored and measured the same way. The two sets of numbers are then compared. In motion, it lights in order. Run 1: Code Mode off: The task&#x27;s starting files, then Session, Code Mode off, then Score and measure. Run 2: Code Mode on, from the same files: The task&#x27;s starting files, then Session, Code Mode on, then Score and measure, then Compare off with on.</desc>
