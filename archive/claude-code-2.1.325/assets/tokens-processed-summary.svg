<title id="tps-title">Tokens processed with Code Mode off and on, by kind of work and model</title>
<desc id="tps-desc">Tokens processed with Code Mode off, then with it on, and the share saved. Totalling 120 records fetched through a tool: Opus 5.5 off 1.55 million, on 0.32 million, saved 79%; Sonnet 5.5 off 1.03 million, on 0.41 million, saved 60%; Haiku 5.5 off 1.05 million, on 0.40 million, saved 62%; Fable 5.2 off 1.05 million, on 0.27 million, saved 75%. Reading and judging 120 records fetched through a tool: Opus 5.5 off 2.98 million, on 1.03 million, saved 65%; Sonnet 5.5 off 2.53 million, on 1.15 million, saved 55%; Haiku 5.5 off 2.44 million, on 1.57 million, saved 36%; Fable 5.2 off 2.15 million, on 0.79 million, saved 63%. Caution for this group: Flattered by patterns in our test data; 2 of 16 Code Mode runs left out two records. Finding and changing things in files: Opus 5.5 off 1.34 million, on 0.76 million, saved 43%; Sonnet 5.5 off 1.05 million, on 0.69 million, saved 34%; Haiku 5.5 off 1.42 million, on 0.81 million, saved 43%; Fable 5.2 off 0.91 million, on 0.81 million, saved 11%. One question about one file (the control): Opus 5.5 off 0.18 million, on 0.12 million, saved 29%; Sonnet 5.5 off 0.18 million, on 0.12 million, saved 29%; Haiku 5.5 off 0.18 million, on 0.13 million, saved 29%; Fable 5.2 off 0.18 million, on 0.13 million, saved 28%. All six tests, no percentage given because the totals depend on this mix of tests: Opus 5.5 off 6.04 million, on 2.24 million; Sonnet 5.5 off 4.79 million, on 2.38 million; Haiku 5.5 off 5.10 million, on 2.91 million; Fable 5.2 off 4.29 million, on 2.00 million.</desc>
