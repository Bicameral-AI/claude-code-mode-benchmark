<title id="tps-title">Tokens processed with Code Mode off and on, by kind of work and model</title>
<desc id="tps-desc">Tokens processed on Claude Code 2.1.326 with Code Mode off, then with it on, and the share saved. Totalling 120 records fetched through a tool: Opus 5.5 off 1.51 million, on 0.35 million, saved 77%; Sonnet 5.5 off 1.16 million, on 0.38 million, saved 67%; Haiku 5.5 off 1.05 million, on 0.40 million, saved 62%; Fable 5.2 off 1.01 million, on 0.30 million, saved 71%. Reading and judging 120 records fetched through a tool: Opus 5.5 off 2.98 million, on 0.97 million, saved 68%; Sonnet 5.5 off 2.24 million, on 1.14 million, saved 49%; Haiku 5.5 off 2.22 million, on 1.34 million, saved 40%; Fable 5.2 off 2.15 million, on 0.83 million, saved 61%. Caution for this group: Flattered by patterns in our test data; 3 runs left out records, 2 of them with Code Mode on. Finding and changing things in files: Opus 5.5 off 1.33 million, on 0.84 million, saved 37%; Sonnet 5.5 off 1.01 million, on 0.46 million, saved 54%; Haiku 5.5 off 1.19 million, on 1.30 million, 9% more used with Code Mode on; Fable 5.2 off 1.02 million, on 0.87 million, saved 15%. One question about one file (the control): Opus 5.5 off 0.18 million, on 0.12 million, saved 29%; Sonnet 5.5 off 0.18 million, on 0.12 million, saved 30%; Haiku 5.5 off 0.18 million, on 0.13 million, saved 29%; Fable 5.2 off 0.18 million, on 0.13 million, saved 29%. All six tests, no percentage given because the totals depend on this mix of tests: Opus 5.5 off 6.00 million, on 2.29 million; Sonnet 5.5 off 4.58 million, on 2.11 million; Haiku 5.5 off 4.65 million, on 3.17 million; Fable 5.2 off 4.37 million, on 2.13 million.</desc>
