  .t-foot  { font-size: 11.5px; fill: #52514e; }
  @media (prefers-color-scheme: dark) {
    .card  { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .gap   { fill: #1a1a19; }
    .on    { fill: #3987e5; }
    .off   { fill: #184f95; }
    .grid  { stroke: #2c2c2a; }
    .base  { stroke: #383835; }
    .rule  { stroke: #2c2c2a; }
